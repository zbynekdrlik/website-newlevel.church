<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager | New Level Church</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
      /* Custom Admin Theme for New Level Church */
      :root {
        --primary-color: #dc2626;
        --primary-hover: #b91c1c;
        --secondary-color: #2563eb;
        --background-color: #ffffff;
        --sidebar-bg: #1e3a8a;
        --text-color: #171717;
        --text-muted: #525252;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* Sidebar styling */
      [class*="AppMainContainer"] > div:first-child,
      [class*="SidebarNavList"],
      nav[class*="Sidebar"] {
        background-color: var(--sidebar-bg) !important;
      }

      /* Header/Toolbar */
      [class*="ToolbarContainer"],
      [class*="AppHeader"] {
        background-color: var(--background-color) !important;
        border-bottom: 1px solid #e7e5e4 !important;
      }

      /* Primary buttons */
      button[class*="ToolbarButton"],
      button[class*="Button"]:not([class*="DeleteButton"]) {
        background-color: var(--primary-color) !important;
        border-color: var(--primary-color) !important;
        border-radius: 8px !important;
        font-weight: 500 !important;
      }

      button[class*="ToolbarButton"]:hover,
      button[class*="Button"]:not([class*="DeleteButton"]):hover {
        background-color: var(--primary-hover) !important;
        border-color: var(--primary-hover) !important;
      }

      /* Links and active states */
      a[class*="SidebarNavLink"][class*="active"],
      [class*="active"] > a[class*="SidebarNavLink"] {
        background-color: var(--primary-color) !important;
        color: white !important;
      }

      /* Cards and content areas */
      [class*="Card"],
      [class*="EntryCard"],
      [class*="ObjectWidgetTopBar"] {
        border-radius: 12px !important;
        border-color: #e7e5e4 !important;
      }

      /* Collection list items */
      [class*="ListCard"] {
        border-radius: 8px !important;
        transition: all 0.2s ease !important;
      }

      [class*="ListCard"]:hover {
        border-color: var(--primary-color) !important;
        box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.1) !important;
      }

      /* Form inputs */
      input[type="text"],
      input[type="email"],
      input[type="url"],
      textarea,
      select {
        border-radius: 8px !important;
        border-color: #d6d3d1 !important;
        font-family: 'Inter', sans-serif !important;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--primary-color) !important;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15) !important;
      }

      /* Headings in the editor */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Playfair Display', Georgia, serif !important;
      }

      /* Login page styling */
      [class*="LoginButton"] {
        background-color: var(--primary-color) !important;
        border-radius: 9999px !important;
        font-weight: 600 !important;
        padding: 12px 32px !important;
      }

      [class*="LoginButton"]:hover {
        background-color: var(--primary-hover) !important;
      }

      /* Logo area */
      [class*="CustomLogoContainer"],
      [class*="LoginLogo"] {
        font-family: 'Playfair Display', Georgia, serif !important;
        color: var(--primary-color) !important;
      }

      /* Publish dropdown */
      [class*="PublishDropdownItem"]:hover {
        background-color: rgba(220, 38, 38, 0.1) !important;
      }

      /* Success/info colors */
      [class*="success"],
      [class*="Success"] {
        background-color: var(--secondary-color) !important;
      }

      /* Editor toolbar */
      [class*="EditorToolbar"] button {
        border-radius: 6px !important;
      }

      [class*="EditorToolbar"] button:hover {
        background-color: rgba(220, 38, 38, 0.1) !important;
      }

      /* Modal styling */
      [class*="Modal"] {
        border-radius: 16px !important;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f5f5f4;
      }

      ::-webkit-scrollbar-thumb {
        background: #a8a29e;
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #78716c;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Register custom preview styles
      CMS.registerPreviewStyle('/admin/preview.css');
    </script>
  </body>
</html>
